<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>모두가 살기 좋은 세상 만들기</title>
<style>
*{box-sizing:border-box}
body{margin:0;height:100vh;overflow:hidden;font-family:"Malgun Gothic",system-ui,sans-serif;background:linear-gradient(rgba(9,45,28,.3),rgba(9,45,28,.3)),url("assets/social-economy-background.png") center/cover fixed no-repeat;color:#fff}
.intro-screen{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;padding:24px;background:linear-gradient(140deg,rgba(16,41,27,.88),rgba(23,100,58,.78)),url("assets/social-economy-background.png") center/cover no-repeat;color:#fff}
.intro-screen.hide{display:none}
.intro-wrap{width:min(980px,100%);display:grid;gap:14px}
.intro-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px}
.intro-head h2{margin:0;font-size:clamp(22px,3.5vw,38px)}
.intro-head small{color:#d8f6df;font-weight:800}
.intro-video{width:100%;aspect-ratio:16/9;border:4px solid #ffd75e;border-radius:14px;background:#06150d;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.intro-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.intro-actions button{border:0;border-radius:10px;padding:11px 16px;background:#ffd75e;color:#173d29;font-weight:900;cursor:pointer}
.intro-actions button.secondary{background:#eaf7ef;color:#17643a}
.app{height:100%;display:grid;grid-template-rows:auto auto 1fr}
.top{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:10px 16px;background:linear-gradient(100deg,rgba(23,100,58,.94),rgba(41,149,82,.9));border-bottom:3px solid #ffd75e;backdrop-filter:blur(5px)}
.brand h1{font-size:clamp(18px,3vw,26px);margin:0}
.brand small{opacity:.88}
.ledger{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.chip{background:#0c3d26;border:1px solid #73d497;border-radius:10px;padding:6px 9px;font-size:12px;font-weight:800}
.chip.value{background:#104e45;border-color:#5eead4}
.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:9px 12px;background:rgba(234,247,239,.9);backdrop-filter:blur(5px)}
.stage{border:2px solid #afd9bd;border-radius:12px;padding:8px;background:#fff;color:#174d2d;font-weight:900;cursor:pointer}
.stage.active{background:#ffd75e;border-color:#e4a900}
.stage small{display:block;font-weight:500;margin-top:3px}
.workspace{position:relative;min-height:0;background:rgba(217,238,225,.18)}
.game{display:none;width:100%;height:100%;border:0;background:#fff}
.game.active{display:block}
@media(max-width:820px){.top{align-items:flex-start;flex-direction:column}.ledger{justify-content:flex-start}.nav{font-size:12px}}
</style>
</head>
<body>
<section id="intro-screen" class="intro-screen">
 <div class="intro-wrap">
  <div class="intro-head">
   <h2>사회적 가치로 모두가 살기 좋은 세상 만들기</h2>
   <small>연대·협력·상생을 모아 지역 문제를 해결하는 여정을 시작합니다</small>
  </div>
  <video id="intro-video" class="intro-video" src="assets/intro-0727.mp4" controls autoplay muted playsinline></video>
  <div class="intro-actions">
   <button class="secondary" onclick="restartIntroVideo()">처음부터 보기</button>
   <button onclick="enterIntegratedApp()">통합앱 시작</button>
  </div>
 </div>
</section>
<main class="app">
 <header class="top">
  <div class="brand">
    <h1>🌱 모두가 살기 좋은 세상 만들기</h1>
    <small>연대·협력·상생 재료 수집 → 테트리스로 사회적 가치 제작 → 필요한 곳에 가치 전달</small>
  </div>
  <div id="ledger" class="ledger"></div>
 </header>
 <nav class="nav">
  <button class="stage active" data-stage="0">1. 사회적 가치 재료 모으기<small>모두가 행복한 지속가능한 지역사회를 만들기 위해 사회적 가치를 버블을 통해 모아주세요!</small></button>
  <button class="stage" data-stage="1">2. 테트리스로 가치 만들기<small>취약계층 지원·우범지대 개선·지역경제 활성화</small></button>
  <button class="stage" data-stage="2">3. 가치 전달<small>필요한 곳에 가치를 전달해 지속가능한 지역사회 만들기</small></button>
 </nav>
 <section class="workspace">
   <iframe class="game active" title="사회적 가치 재료 모으기" src="2인협동_상생버블_사회적기업건설_저장완성본.html"></iframe>
   <iframe class="game" title="테트리스로 사회적 가치 만들기" src="stage2-tetris.html"></iframe>
   <iframe class="game" title="사회적 가치 전달" src="stage3-delivery.html"></iframe>
 </section>
</main>
<script>
const introScreen=document.getElementById('intro-screen');
const introVideo=document.getElementById('intro-video');
function enterIntegratedApp(){
 introScreen.classList.add('hide');
 introVideo.pause();
}
function restartIntroVideo(){
 introVideo.currentTime=0;
 introVideo.play().catch(()=>{});
}
introVideo.addEventListener('ended',enterIntegratedApp);
const KEY='social_economy_pipeline_v1';
const emptyBook=()=>({capital:0,material1:0,material2:0,material3:0,material1Multiplier:1,material2Multiplier:1,material3Multiplier:1,debt:0,products:{food:0,education:0,welfare:0,clothing:0,service:0,festival:0},revenue:0,bankrupt:false,loanStarted:false,returnFund:0,careFund:0,socialValue:0,socialProductionBonus:0,socialDeliveryBonus:0,socialDebtRelief:0});
let book=loadBook();
function loadBook(){try{const p=Object.assign(emptyBook(),JSON.parse(localStorage.getItem(KEY)||'{}'));p.products=Object.assign(emptyBook().products,p.products||{});return p}catch(e){return emptyBook()}}
function saveBook(p){book=Object.assign(emptyBook(),p||{});book.products=Object.assign(emptyBook().products,book.products||{});applySocialBenefits();localStorage.setItem(KEY,JSON.stringify(book));render();syncAll()}
function stockCount(){return Object.values(book.products).reduce((a,b)=>a+Number(b||0),0)}
function socialBreakdown(){
 const stock=stockCount();
 const balancedMaterial=Math.min(Number(book.material1||0),Number(book.material2||0),Number(book.material3||0));
 const resource=Math.min(20,Math.floor(balancedMaterial*2));
 const production=Math.min(25,Math.floor(stock*2));
 const distribution=Math.min(25,Math.floor((book.revenue||0)/45));
 const communityReturn=Math.min(15,Math.floor((book.returnFund||0)/25));
 const careReturn=Math.min(15,Math.floor((book.careFund||0)/25));
 const returnScore=communityReturn+careReturn;
 const pillars=[resource,production,distribution,returnScore];
 const weakest=Math.min(...pillars);
 let balanceCap=100;
 if(weakest<5)balanceCap=40;
 else if(weakest<10)balanceCap=60;
 else if(weakest<15)balanceCap=80;
 const raw=Math.max(0,resource+production+distribution+returnScore);
 return {resource,production,distribution,returnScore,communityReturn,careReturn,balanceCap,score:Math.min(100,balanceCap,raw),weakest};
}
function socialScore(){
 return socialBreakdown().score;
}
function grade(score){return score>=85?'A':score>=70?'B':score>=55?'C':'보완 필요'}
function applySocialBenefits(){
 const score=socialScore();
 book.socialValue=score;
 book.socialProductionBonus=score>=30?1:0;
 book.socialDeliveryBonus=score>=60 ? .1 : 0;
 book.socialDebtRelief=score>=80?100:0;
}
function valueOutputText(stock){
  if(stock>=12)return '취약계층 지원 · 우범지대 개선 · 지역경제 활성화';
  if(stock>=8)return '취약계층 지원 · 우범지대 개선';
  if(stock>=4)return '취약계층 지원';
  return '제작 대기';
}
function render(){
  const products=book.products||{};
  document.getElementById('ledger').innerHTML=`<span class="chip">🤝 연대 ${Math.ceil(book.material1)}</span><span class="chip">🧩 협력 ${Math.ceil(book.material2)}</span><span class="chip">🌱 상생 ${Math.ceil(book.material3)}</span><span class="chip value">🫶 취약계층 지원 ${Math.floor(Number(products.welfare)||0)}</span><span class="chip value">💡 우범지대 개선 ${Math.floor(Number(products.service)||0)}</span><span class="chip value">🏪 지역경제 활성화 ${Math.floor(Number(products.festival)||0)}</span>`;
  refreshReport();
}
function refreshReport(){
  applySocialBenefits();
}
function sync(frame){try{frame.contentWindow.postMessage({type:'pipeline-sync',data:book},'*')}catch(e){}}
function syncAll(){document.querySelectorAll('.game').forEach(sync)}
window.addEventListener('message',e=>{if(e.data?.type==='pipeline-save')saveBook(e.data.data);if(e.data?.type==='reset-all-games'){localStorage.removeItem('yeongju_coop_bubble_save_v1');localStorage.removeItem('social_economy_tetris_reset_data');book=emptyBook();localStorage.setItem(KEY,JSON.stringify(book));render();gameFrames.forEach(frame=>{const src=frame.getAttribute('src');if(src)frame.setAttribute('src',src)})}});
const stageButtons=[...document.querySelectorAll('.stage')],gameFrames=[...document.querySelectorAll('.game')];
let activeStage=0;
function transitionMessage(from,to){
 const names=['사회적 가치 재료 모으기','테트리스로 사회적 가치 만들기','가치 전달'];
 return `${names[from]}을(를) 종료하고 ${names[to]}으로 넘어가시겠습니까?\n\n확인을 누르면 현재 게임은 종료됩니다.`;
}
function endStage(index){const frame=gameFrames[index],src=frame.getAttribute('src');frame.classList.remove('active');if(src)frame.setAttribute('src',src)}
function changeStage(nextStage){if(nextStage===activeStage)return;if((activeStage===0&&nextStage===1)||(activeStage===1&&nextStage===2)){if(!confirm(transitionMessage(activeStage,nextStage)))return}endStage(activeStage);activeStage=nextStage;stageButtons.forEach((button,i)=>button.classList.toggle('active',i===activeStage));gameFrames.forEach((frame,i)=>frame.classList.toggle('active',i===activeStage));sync(gameFrames[activeStage])}
gameFrames.forEach(f=>f.addEventListener('load',()=>sync(f)));
stageButtons.forEach((button,i)=>button.onclick=()=>changeStage(i));
function resetBook(){if(confirm('연대·협력·상생과 세 분야의 만든 가치를 모두 초기화하고 새로 시작할까요?'))saveBook(emptyBook())}
render();
</script>
</body>
</html>
