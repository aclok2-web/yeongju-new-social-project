<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>영주 사회적경제 상생 버블 슈터</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #eef7f2 0%, #d8edd9 100%);
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .game-container {
            width: 500px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            overflow: hidden;
            border: 4px solid #4a9e58;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .header {
            background-color: #4a9e58;
            color: white;
            padding: 12px;
            text-align: center;
            font-weight: bold;
            font-size: 1.1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .score-board {
            font-size: 0.95rem;
            background: rgba(0, 0, 0, 0.2);
            padding: 5px 12px;
            border-radius: 12px;
        }
        #game-canvas {
            background: #fafcfb;
            display: block;
            margin: 0 auto;
            cursor: crosshair;
        }
        .footer {
            padding: 15px;
            background: #f4faf5;
            border-top: 2px solid #e1efe3;
            text-align: center;
        }
        .instructions {
            font-size: 0.85rem;
            color: #444;
            margin-bottom: 8px;
            font-weight: bold;
        }
        .values-legend {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 6px;
            font-size: 0.75rem;
            margin-bottom: 12px;
        }
        .legend-item {
            padding: 2px 6px;
            border-radius: 6px;
            color: white;
            font-weight: bold;
        }
        .reset-btn, #bgm-btn {
            color: #333;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
        }
        #bgm-btn { background-color: #ffd043; transition: background 0.2s; }
        #bgm-btn.active { background-color: #2ecc71; color: white; }
        .reset-btn { background-color: #ff7675; color: white; }
        
        /* Game Over / Success Overlay Screen */
        #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.93);
            color: white;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            text-align: center;
            padding: 30px;
        }
        #game-over-screen h2 {
            font-size: 2.4rem;
            margin-bottom: 15px;
            color: #ffd043;
        }
        #game-over-screen p.main-quote {
            font-size: 1.25rem;
            line-height: 1.6;
            margin-bottom: 25px;
            color: #e2e8f0;
            font-weight: bold;
            max-width: 90%;
            word-break: keep-all;
        }
        #game-over-screen p.score-info {
            font-size: 1.05rem;
            margin-bottom: 20px;
            color: #a7f3d0;
        }
        #start-btn {
            background-color: #ffd043;
            color: #333;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.1s;
        }
        #start-btn:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

<div class="game-container">
    <div class="header">
        <span>🤝 영주 상생 버블 슈터</span>
        <div class="score-board">사회적 가치: <span id="score">0</span></div>
        <button id="bgm-btn" onclick="toggleBGM()">🎵 신나는 트로트 ON</button>
        <button class="reset-btn" onclick="resetGame()">리셋</button>
    </div>

    <div style="position: relative;">
        <canvas id="game-canvas" width="480" height="520"></canvas>
        <div id="game-over-screen">
            <h2 id="end-title">연대 완료!</h2>
            <p class="main-quote" id="end-quote">"경쟁을 넘어선 연대의 힘!<br>당신이 만든 가치가 마을을 환하게 밝힙니다."</p>
            <p class="score-info">최종 환원 가치: <b><span id="final-score">0</span></b>점</p>
            <button id="start-btn" onclick="resetGame()">다시 기여하기</button>
        </div>
    </div>

    <div class="footer">
        <div class="instructions">같은 가치를 3개 이상 연결해 상생의 마을을 이룩하세요!</div>
        <div class="values-legend">
            <span class="legend-item" style="background:#e74c3c">🍎 협동</span>
            <span class="legend-item" style="background:#f1c40f; color:#333">🍐 나눔</span>
            <span class="legend-item" style="background:#9b59b6">🍇 상생</span>
            <span class="legend-item" style="background:#ff7675">🍑 일자리</span>
            <span class="legend-item" style="background:#d5a973">🌱 지역개발</span>
        </div>
    </div>
</div>

<script>
    // --- Web Audio API 기반 국악 퓨전 트로트 (Korean Folk-Pop/Trot) 자체 신디사이저 엔진 ---
    class TrotSynthesizer {
        constructor() {
            this.ctx = null;
            this.isPlaying = false;
            this.tempo = 125; 
            this.beatDuration = 60 / this.tempo;
            this.step = 0;
            this.intervalId = null;
            
            this.melodyScale = [
                220.00, // A3
                261.63, // C4
                293.66, // D4
                329.63, // E4
                392.00, // G4
                440.00, // A4
                523.25, // C5
                587.33, // D5
                659.25, // E5
                783.99, // G5
                880.00  // A5
            ];
            
            this.melodyPattern = [
                5, 7, 8, 7,  9, 8, 7, -1,
                8, 7, 5, 6,  5, 3, 5, -1,
                8, 9, 10, 9, 8, 7, 8, -1,
                7, 5, 3, 2,  3, -1, 5, -1
            ];
            
            this.bassPattern = [
                0, 3, 0, 3,  1, 4, 1, 4,
                0, 3, 0, 3,  2, 5, 2, 5,
                0, 3, 0, 3,  1, 4, 1, 4,
                0, 3, 0, 3,  0, 0, 0, -1
            ];
        }

        start() {
            if (this.isPlaying) return;
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            this.isPlaying = true;
            this.step = 0;
            
            const lookAhead = 0.1;
            let nextNoteTime = this.ctx.currentTime;
            
            this.intervalId = setInterval(() => {
                while (nextNoteTime < this.ctx.currentTime + lookAhead) {
                    this.playStep(nextNoteTime);
                    nextNoteTime += this.beatDuration * 0.25; 
                    this.step = (this.step + 1) % this.melodyPattern.length;
                }
            }, 25);
        }

        stop() {
            if (!this.isPlaying) return;
            clearInterval(this.intervalId);
            if (this.ctx) {
                this.ctx.close();
            }
            this.isPlaying = false;
        }

        playStep(time) {
            const melodyIdx = this.melodyPattern[this.step];
            if (melodyIdx !== -1 && melodyIdx !== undefined) {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                
                const lfo = this.ctx.createOscillator();
                const lfoGain = this.ctx.createGain();
                lfo.frequency.value = 8; 
                lfoGain.gain.value = 15; 
                lfo.connect(osc.frequency);
                
                osc.type = 'triangle'; 
                osc.frequency.setValueAtTime(this.melodyScale[melodyIdx], time);
                
                gain.gain.setValueAtTime(0.08, time);
                gain.gain.exponentialRampToValueAtTime(0.001, time + this.beatDuration * 0.22);
                
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                
                lfo.start(time);
                osc.start(time);
                osc.stop(time + this.beatDuration * 0.23);
                lfo.stop(time + this.beatDuration * 0.23);
            }

            const bassIdx = this.bassPattern[this.step];
            if (bassIdx !== -1 && this.step % 2 === 0) {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(this.melodyScale[bassIdx % 5] * 0.5, time); 
                
                gain.gain.setValueAtTime(0.18, time);
                gain.gain.exponentialRampToValueAtTime(0.001, time + this.beatDuration * 0.4);
                
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                
                osc.start(time);
                osc.stop(time + this.beatDuration * 0.4);
            }
        }
    }

    const synth = new TrotSynthesizer();
    let isBgmOn = false;

    function toggleBGM() {
        const btn = document.getElementById('bgm-btn');
        if (!isBgmOn) {
            synth.start();
            isBgmOn = true;
            btn.innerText = "🔇 트로트 OFF";
            btn.classList.add('active');
        } else {
            synth.stop();
            isBgmOn = false;
            btn.innerText = "🎵 신나는 트로트 ON";
            btn.classList.remove('active');
        }
    }

    // --- GAME ENGINE SCRIPT ---
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const gameOverScreen = document.getElementById('game-over-screen');
    const endTitleEl = document.getElementById('end-title');
    const finalScoreEl = document.getElementById('final-score');

    const ROWS = 9;
    const COLS = 10;
    const BUBBLE_RADIUS = 24;
    const SHOOTER_Y = canvas.height - 65;

    const FRUIT_COLORS = {
        1: { name: '협동', main: '#e74c3c', text: '협동' },
        2: { name: '나눔', main: '#f1c40f', text: '나눔' },
        3: { name: '상생', main: '#9b59b6', text: '상생' },
        4: { name: '일자리', main: '#ff7675', text: '일자리' },
        5: { name: '지역개발', main: '#d5a973', text: '개발' }
    };
    const NUM_FRUITS = 5;

    let grid = [];
    let score = 0;
    let currentBubble = null;
    let nextBubble = null;
    let isGameOver = false;

    class Bubble {
        constructor(x, y, type) {
            this.x = x;
            this.y = y;
            this.type = type;
            this.radius = BUBBLE_RADIUS;
            this.vx = 0;
            this.vy = 0;
            this.isMoving = false;
        }

        draw(context) {
            if (!this.type || this.type === 0) return;
            const config = FRUIT_COLORS[this.type];

            context.save();
            context.beginPath();
            context.arc(this.x, this.y, this.radius - 2, 0, Math.PI * 2);
            context.fillStyle = config.main;
            context.fill();
            
            context.fillStyle = (this.type === 2) ? '#333' : '#fff';
            context.font = 'bold 11px sans-serif';
            context.textAlign = 'center';
            context.textBaseline = 'middle';
            context.fillText(config.text, this.x, this.y);
            context.restore();
        }
    }

    function initGrid() {
        grid = [];
        for (let r = 0; r < ROWS; r++) {
            grid[r] = [];
            for (let c = 0; c < COLS; c++) {
                if (r < 3) { 
                    const type = Math.floor(Math.random() * NUM_FRUITS) + 1;
                    grid[r][c] = new Bubble(0, 0, type);
                } else {
                    grid[r][c] = null;
                }
            }
        }
        updateGridPositions();
    }

    function updateGridPositions() {
        for (let r = 0; r < ROWS; r++) {
            const isOddRow = (r % 2 === 1);
            const rowOffset = isOddRow ? BUBBLE_RADIUS : 0;
            for (let c = 0; c < COLS; c++) {
                if (grid[r][c]) {
                    grid[r][c].x = c * (BUBBLE_RADIUS * 2) + BUBBLE_RADIUS + rowOffset;
                    grid[r][c].y = r * (BUBBLE_RADIUS * 2 * 0.86) + BUBBLE_RADIUS;
                }
            }
        }
    }

    function spawnShooter() {
        if (isGameOver) return;
        const randType = () => Math.floor(Math.random() * NUM_FRUITS) + 1;

        if (!nextBubble) {
            nextBubble = new Bubble(60, canvas.height - 45, randType());
        }

        currentBubble = new Bubble(canvas.width / 2, SHOOTER_Y - 20, nextBubble.type);
        nextBubble = new Bubble(60, canvas.height - 45, randType());
    }

    let mouseX = canvas.width / 2;
    let mouseY = 0;

    canvas.addEventListener('mousemove', (e) => {
        const rect = canvas.getBoundingClientRect();
        mouseX = e.clientX - rect.left;
        mouseY = e.clientY - rect.top;
    });

    canvas.addEventListener('click', () => {
        if (currentBubble && !currentBubble.isMoving && !isGameOver) {
            const dx = mouseX - currentBubble.x;
            const dy = mouseY - currentBubble.y;
            const len = Math.sqrt(dx * dx + dy * dy);
            const speed = 12;
            currentBubble.vx = (dx / len) * speed;
            currentBubble.vy = (dy / len) * speed;
            currentBubble.isMoving = true;
        }
    });

    function resetGame() {
        score = 0;
        scoreEl.innerText = score;
        isGameOver = false;
        gameOverScreen.style.display = 'none';
        initGrid();
        nextBubble = null;
        spawnShooter();
    }

    function update() {
        if (isGameOver) return;

        if (currentBubble && currentBubble.isMoving) {
            currentBubble.x += currentBubble.vx;
            currentBubble.y += currentBubble.vy;

            if (currentBubble.x - BUBBLE_RADIUS < 0) {
                currentBubble.x = BUBBLE_RADIUS;
                currentBubble.vx *= -1;
            } else if (currentBubble.x + BUBBLE_RADIUS > canvas.width) {
                currentBubble.x = canvas.width - BUBBLE_RADIUS;
                currentBubble.vx *= -1;
            }

            if (currentBubble.y - BUBBLE_RADIUS < 0) {
                snapToGrid(currentBubble);
            } else {
                let hit = false;
                for (let r = 0; r < ROWS; r++) {
                    for (let c = 0; c < COLS; c++) {
                        const target = grid[r][c];
                        if (target) {
                            const dist = Math.hypot(currentBubble.x - target.x, currentBubble.y - target.y);
                            if (dist < BUBBLE_RADIUS * 1.7) {
                                hit = true;
                                break;
                            }
                        }
                    }
                    if (hit) break;
                }
                if (hit) snapToGrid(currentBubble);
            }
        }
    }

    function snapToGrid(bubble) {
        bubble.isMoving = false;
        let bestR = 0, bestC = 0;
        let minDist = Infinity;

        for (let r = 0; r < ROWS; r++) {
            const isOddRow = (r % 2 === 1);
            const rowOffset = isOddRow ? BUBBLE_RADIUS : 0;
            for (let c = 0; c < COLS; c++) {
                if (!grid[r][c]) {
                    const cx = c * (BUBBLE_RADIUS * 2) + BUBBLE_RADIUS + rowOffset;
                    const cy = r * (BUBBLE_RADIUS * 2 * 0.86) + BUBBLE_RADIUS;
                    const dist = Math.hypot(bubble.x - cx, bubble.y - cy);
                    if (dist < minDist) {
                        minDist = dist;
                        bestR = r;
                        bestC = c;
                    }
                }
            }
        }

        grid[bestR][bestC] = new Bubble(0, 0, bubble.type);
        updateGridPositions();

        let matches = [];
        findMatches(bestR, bestC, bubble.type, matches);

        if (matches.length >= 3) {
            matches.forEach(cell => { grid[cell.r][cell.c] = null; });
            score += matches.length * 15;
            scoreEl.innerText = score;
            removeFloatingBubbles();
        }

        if (checkAllCleared()) {
            triggerGameEnd(true);
            return;
        }

        for (let c = 0; c < COLS; c++) {
            if (grid[ROWS - 2][c]) {
                triggerGameEnd(false);
                return;
            }
        }
        spawnShooter();
    }

    function checkAllCleared() {
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                if (grid[r][c] !== null) return false;
            }
        }
        return true;
    }

    function findMatches(r, c, type, matches) {
        if (matches.some(m => m.r === r && m.c === c)) return;
        matches.push({r, c});

        const neighbors = getNeighbors(r, c);
        neighbors.forEach(n => {
            const neighborBubble = grid[n.r][n.c];
            if (neighborBubble && neighborBubble.type === type) {
                findMatches(n.r, n.c, type, matches);
            }
        });
    }

    function getNeighbors(r, c) {
        const neighbors = [];
        const isOddRow = (r % 2 === 1);
        const directions = isOddRow ? [
            {dr: -1, dc: 0}, {dr: -1, dc: 1},
            {dr: 0, dc: -1}, {dr: 0, dc: 1},
            {dr: 1, dc: 0}, {dr: 1, dc: 1}
        ] : [
            {dr: -1, dc: -1}, {dr: -1, dc: 0},
            {dr: 0, dc: -1}, {dr: 0, dc: 1},
            {dr: 1, dc: -1}, {dr: 1, dc: 0}
        ];

        directions.forEach(d => {
            const nr = r + d.dr;
            const nc = c + d.dc;
            if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
                neighbors.push({r: nr, c: nc});
            }
        });
        return neighbors;
    }

    function removeFloatingBubbles() {
        const connected = Array.from({length: ROWS}, () => Array(COLS).fill(false));
        let queue = [];

        for (let c = 0; c < COLS; c++) {
            if (grid[0][c]) {
                connected[0][c] = true;
                queue.push({r: 0, c: c});
            }
        }

        while (queue.length > 0) {
            const {r, c} = queue.shift();
            const neighbors = getNeighbors(r, c);
            neighbors.forEach(n => {
                if (grid[n.r][n.c] && !connected[n.r][n.c]) {
                    connected[n.r][n.c] = true;
                    queue.push({r: n.r, c: n.c});
                }
            });
        }

        for (let r = 1; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                if (grid[r][c] && !connected[r][c]) {
                    grid[r][c] = null;
                    score += 10;
                    scoreEl.innerText = score;
                }
            }
        }
    }

    function triggerGameEnd(isWin) {
        isGameOver = true;
        finalScoreEl.innerText = score;
        
        if (isWin) {
            endTitleEl.innerText = "연대 완료! 🌟";
            endTitleEl.style.color = "#ffd043";
        } else {
            endTitleEl.innerText = "상생 과제 잔존";
            endTitleEl.style.color = "#ff7675";
        }
        
        gameOverScreen.style.display = 'flex';
    }

    function drawCharacterCannon(cx, cy, angle) {
        ctx.save();
        ctx.translate(cx, cy);
        
        ctx.fillStyle = '#34495e';
        ctx.beginPath();
        ctx.moveTo(-25, 45);
        ctx.lineTo(-15, 5);
        ctx.lineTo(15, 5);
        ctx.lineTo(25, 45);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = '#27ae60';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(-10, 5);
        ctx.lineTo(0, 20);
        ctx.lineTo(10, 5);
        ctx.stroke();

        ctx.fillStyle = '#ffdad0';
        ctx.beginPath();
        ctx.arc(0, -10, 20, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ff7675';
        ctx.beginPath();
        ctx.arc(-10, -8, 4, 0, Math.PI * 2);
        ctx.arc(10, -8, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#333';
        ctx.beginPath();
        ctx.arc(-6, -12, 2, 0, Math.PI * 2);
        ctx.arc(6, -12, 2, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#2c3e50';
        ctx.fillRect(-26, -26, 52, 6);
        ctx.beginPath();
        ctx.moveTo(-16, -26);
        ctx.lineTo(-10, -42);
        ctx.lineTo(10, -42);
        ctx.lineTo(16, -26);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#e74c3c';
        ctx.beginPath();
        ctx.arc(0, -48, 7, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#2ecc71';
        ctx.fillRect(1, -57, 2, 3);
        
        ctx.fillStyle = '#eccc68';
        ctx.beginPath();
        ctx.ellipse(-16, -35, 4, 8, Math.PI/4, 0, Math.PI*2);
        ctx.ellipse(16, -35, 4, 8, -Math.PI/4, 0, Math.PI*2);
        ctx.fill();

        ctx.restore();

        ctx.save();
        ctx.translate(cx, cy - 20);
        ctx.rotate(angle);
        
        ctx.beginPath();
        ctx.setLineDash([4, 4]);
        ctx.moveTo(0, 0);
        ctx.lineTo(0, -160);
        ctx.strokeStyle = '#4a9e58';
        ctx.lineWidth = 2;
        ctx.stroke();
        
        ctx.setLineDash([]);
        ctx.fillStyle = '#4a9e58';
        ctx.beginPath();
        ctx.moveTo(0, -165);
        ctx.lineTo(-6, -153);
        ctx.lineTo(6, -153);
        ctx.closePath();
        ctx.fill();

        ctx.restore();
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                if (grid[r][c]) grid[r][c].draw(ctx);
            }
        }

        ctx.fillStyle = '#f4faf5';
        ctx.fillRect(0, canvas.height - 95, canvas.width, 95);
        ctx.strokeStyle = '#e1efe3';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, canvas.height - 95);
        ctx.lineTo(canvas.width, canvas.height - 95);
        ctx.stroke();

        const dx = mouseX - (canvas.width / 2);
        const dy = mouseY - SHOOTER_Y;
        const angle = Math.atan2(dx, -dy);

        drawCharacterCannon(canvas.width / 2, SHOOTER_Y, angle);

        ctx.fillStyle = '#4a9e58';
        ctx.font = 'bold 11px sans-serif';
        ctx.fillText('다음 가치', 38, canvas.height - 75);
        if (nextBubble) nextBubble.draw(ctx);
        if (currentBubble) currentBubble.draw(ctx);

        ctx.font = '28px Arial';
        ctx.fillText('🧺', canvas.width / 2 - 14, canvas.height - 5);
    }

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    resetGame();
    loop();
</script>

</body>
</html>
