<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>사회적 가치 모으기 게임</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(#174331, #2d6b4c);
      font-family: "Pretendard", "Noto Sans KR", sans-serif;
      color: white;
      overflow: hidden;
    }
    .game-wrap {
      width: min(94vw, 760px);
      text-align: center;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      padding: 0 4px;
      font-weight: 800;
      font-size: 18px;
    }
    .panel {
      background: rgba(255,255,255,.12);
      border: 1px solid rgba(255,255,255,.22);
      border-radius: 14px;
      padding: 8px 14px;
      backdrop-filter: blur(8px);
    }
    canvas {
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 10;
      display: block;
      background: #e7f8ec;
      border: 4px solid rgba(255,255,255,.9);
      border-radius: 20px;
      box-shadow: 0 18px 45px rgba(0,0,0,.35);
      touch-action: none;
    }
    .info {
      margin-top: 10px;
      font-size: 14px;
      opacity: .9;
    }
    .notice {
      margin: 10px auto 0;
      min-height: 42px;
      padding: 10px 14px;
      border-radius: 14px;
      background: rgba(255,255,255,.16);
      border: 1px solid rgba(255,255,255,.22);
      font-weight: 800;
      line-height: 1.45;
    }
    .controls {
      margin: 14px auto 0;
      width: 210px;
      display: grid;
      grid-template-columns: repeat(3, 62px);
      grid-template-rows: repeat(2, 58px);
      gap: 8px;
      justify-content: center;
      user-select: none;
    }
    .btn {
      border: 0;
      border-radius: 16px;
      background: rgba(255,255,255,.18);
      color: white;
      font-size: 26px;
      font-weight: 900;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.2);
      touch-action: none;
      cursor: pointer;
    }
    .btn:active, .btn.active {
      transform: translateY(2px);
      background: rgba(255,255,255,.32);
    }
    .up { grid-column: 2; grid-row: 1; }
    .left { grid-column: 1; grid-row: 2; }
    .down { grid-column: 2; grid-row: 2; }
    .right { grid-column: 3; grid-row: 2; }

    .overlay {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: rgba(3, 8, 25, .72);
      z-index: 10;
      padding: 20px;
    }
    .card {
      width: min(90vw, 420px);
      background: white;
      color: #15213e;
      border-radius: 24px;
      padding: 30px 24px;
      box-shadow: 0 24px 70px rgba(0,0,0,.4);
    }
    .card h1 { margin: 0 0 10px; font-size: 30px; }
    .card p { line-height: 1.65; }
    .start-btn {
      margin-top: 10px;
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 14px;
      background: #2f7d4a;
      color: white;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
    }
    .hidden { display: none; }

    @media (min-width: 800px) {
      .controls { display: none; }
    }
  </style>
</head>
<body>
  <div class="game-wrap">
    <div class="topbar">
      <div class="panel">🌱 가치 점수: <span id="score">0</span></div>
      <div class="panel">⏱️ 시간: <span id="time">60</span></div>
    </div>

    <canvas id="game" width="800" height="500"></canvas>

    <div class="info">
      상상이 캐릭터를 방향키 또는 WASD로 움직이세요. 협력·연대·상생 가치를 모으면 10점씩 얻습니다.
    </div>
    <div class="notice" id="notice">사회적 가치 아이템을 모아 더 따뜻한 지역을 만들어 보세요!</div>

    <div class="controls" aria-label="모바일 방향키">
      <button class="btn up" data-key="ArrowUp">▲</button>
      <button class="btn left" data-key="ArrowLeft">◀</button>
      <button class="btn down" data-key="ArrowDown">▼</button>
      <button class="btn right" data-key="ArrowRight">▶</button>
    </div>
  </div>

  <div class="overlay" id="startOverlay">
    <div class="card">
      <h1>🌱 사회적 가치 모으기</h1>
      <p>
        상상이 캐릭터를 움직여 <b>협력</b>, <b>연대</b>, <b>상생</b> 가치를 모으세요.<br>
        제한시간은 60초이며, 가치 하나당 10점입니다.
      </p>
      <button class="start-btn" id="startBtn">게임 시작</button>
    </div>
  </div>

  <div class="overlay hidden" id="endOverlay">
    <div class="card">
      <h1>게임 종료!</h1>
      <p>모은 사회적 가치 점수는 <strong><span id="finalScore">0</span>점</strong>입니다.</p>
      <button class="start-btn" id="restartBtn">다시 시작</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    const scoreEl = document.getElementById("score");
    const timeEl = document.getElementById("time");
    const finalScoreEl = document.getElementById("finalScore");
    const noticeEl = document.getElementById("notice");
    const startOverlay = document.getElementById("startOverlay");
    const endOverlay = document.getElementById("endOverlay");
    const startBtn = document.getElementById("startBtn");
    const restartBtn = document.getElementById("restartBtn");

    const keys = {};
    let score = 0;
    let timeLeft = 60;
    let running = false;
    let lastTime = 0;
    let timerId = null;
    let stars = [];
    let particles = [];

    const socialValues = [
      { name: "협력", icon: "🤝", color: "#2f7d4a", bg: "#e9f8dc", meaning: "힘을 모아 혼자보다 더 큰 변화를 만드는 가치" },
      { name: "연대", icon: "🫶", color: "#2f66a0", bg: "#e2f0ff", meaning: "서로 돕고 연결되어 함께 성장하는 가치" },
      { name: "상생", icon: "🌱", color: "#9a6a17", bg: "#fff1c8", meaning: "모두가 함께 이익을 나누며 살아가는 가치" }
    ];

    const mascotSheet = new Image();
    let mascotSprite = null;

    const player = {
      x: 100,
      y: 250,
      width: 92,
      height: 76,
      speed: 270
    };

    function prepareMascotSprite() {
      if (!mascotSheet.naturalWidth || !mascotSheet.naturalHeight) return;
      const off = document.createElement("canvas");
      off.width = mascotSheet.naturalWidth;
      off.height = mascotSheet.naturalHeight;
      const octx = off.getContext("2d");
      octx.drawImage(mascotSheet, 0, 0);
      const img = octx.getImageData(0, 0, off.width, off.height);
      const data = img.data;
      for (let i = 0; i < data.length; i += 4) {
        const r = data[i], g = data[i + 1], b = data[i + 2];
        if (r < 24 && g < 24 && b < 24) data[i + 3] = 0;
      }
      octx.putImageData(img, 0, 0);
      mascotSprite = off;
      draw();
    }
    mascotSheet.onload = prepareMascotSprite;
    mascotSheet.onerror = () => {
      noticeEl.textContent = "상상이 이미지(sangsange.png)를 불러오지 못했습니다. 파일 위치를 확인해 주세요.";
    };
    mascotSheet.src = "sangsange.png";
    if (mascotSheet.complete && mascotSheet.naturalWidth) prepareMascotSprite();

    function resetGame() {
      score = 0;
      timeLeft = 60;
      scoreEl.textContent = score;
      timeEl.textContent = timeLeft;

      player.x = 100;
      player.y = canvas.height / 2 - player.height / 2;

      stars = [];
      particles = [];
      noticeEl.textContent = "사회적 가치 아이템을 모아 더 따뜻한 지역을 만들어 보세요!";
      for (let i = 0; i < 7; i++) spawnStar();
    }

    function spawnStar() {
      const radius = 34;
      const value = socialValues[Math.floor(Math.random() * socialValues.length)];
      stars.push({
        x: radius + Math.random() * (canvas.width - radius * 2),
        y: radius + 55 + Math.random() * (canvas.height - radius * 2 - 55),
        radius,
        value,
        rotation: Math.random() * Math.PI * 2
      });
    }

    function startGame() {
      resetGame();
      startOverlay.classList.add("hidden");
      endOverlay.classList.add("hidden");
      running = true;
      lastTime = performance.now();

      clearInterval(timerId);
      timerId = setInterval(() => {
        if (!running) return;
        timeLeft--;
        timeEl.textContent = timeLeft;
        if (timeLeft <= 0) endGame();
      }, 1000);

      requestAnimationFrame(gameLoop);
    }

    function endGame() {
      running = false;
      clearInterval(timerId);
      finalScoreEl.textContent = score;
      endOverlay.classList.remove("hidden");
    }

    function update(dt) {
      let dx = 0;
      let dy = 0;

      if (keys.ArrowLeft || keys.a || keys.A) dx -= 1;
      if (keys.ArrowRight || keys.d || keys.D) dx += 1;
      if (keys.ArrowUp || keys.w || keys.W) dy -= 1;
      if (keys.ArrowDown || keys.s || keys.S) dy += 1;

      if (dx !== 0 || dy !== 0) {
        const length = Math.hypot(dx, dy);
        dx /= length;
        dy /= length;
      }

      player.x += dx * player.speed * dt;
      player.y += dy * player.speed * dt;

      player.x = Math.max(0, Math.min(canvas.width - player.width, player.x));
      player.y = Math.max(48, Math.min(canvas.height - player.height, player.y));

      stars.forEach(star => star.rotation += dt * 1.6);

      for (let i = stars.length - 1; i >= 0; i--) {
        const star = stars[i];
        const nearestX = Math.max(player.x, Math.min(star.x, player.x + player.width));
        const nearestY = Math.max(player.y, Math.min(star.y, player.y + player.height));
        const distX = star.x - nearestX;
        const distY = star.y - nearestY;

        if (distX * distX + distY * distY < star.radius * star.radius) {
          score += 10;
          scoreEl.textContent = score;
          noticeEl.textContent = `${star.value.icon} ${star.value.name}: ${star.value.meaning}`;
          createParticles(star.x, star.y, star.value.color);
          stars.splice(i, 1);
          spawnStar();
        }
      }

      particles.forEach(p => {
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt;
      });
      particles = particles.filter(p => p.life > 0);
    }

    function createParticles(x, y, color = "#fff8a8") {
      for (let i = 0; i < 12; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 60 + Math.random() * 120;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: .5 + Math.random() * .35,
          color
        });
      }
    }

    function drawBackground() {
      const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
      gradient.addColorStop(0, "#8ed7ff");
      gradient.addColorStop(1, "#dff5c8");
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "rgba(255,255,255,.75)";
      for (let i = 0; i < 5; i++) {
        const x = 80 + i * 180;
        const y = 75 + (i % 2) * 35;
        ctx.beginPath();
        ctx.arc(x, y, 26, 0, Math.PI * 2);
        ctx.arc(x + 28, y - 8, 34, 0, Math.PI * 2);
        ctx.arc(x + 60, y, 26, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.fillStyle = "#76c85c";
      ctx.fillRect(0, canvas.height - 55, canvas.width, 55);

      ctx.fillStyle = "#5ca746";
      for (let i = 0; i < 18; i++) {
        ctx.beginPath();
        ctx.arc(i * 50, canvas.height - 45, 32, Math.PI, 0);
        ctx.fill();
      }
    }

    function drawStar(star) {
      const w = 86;
      const h = 48;
      const value = star.value;
      ctx.save();
      ctx.translate(star.x, star.y);
      ctx.rotate(Math.sin(star.rotation) * 0.08);

      ctx.fillStyle = "rgba(0,0,0,.18)";
      ctx.beginPath();
      ctx.ellipse(0, h / 2 + 8, w / 2 - 10, 8, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = value.bg;
      ctx.strokeStyle = value.color;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.roundRect(-w / 2, -h / 2, w, h, 16);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = value.color;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = "900 25px 'Malgun Gothic', sans-serif";
      ctx.fillText(`${value.icon} ${value.name}`, 0, 0);
      ctx.restore();
    }

    function drawPlayer() {
      const x = player.x;
      const y = player.y;

      ctx.save();
      ctx.fillStyle = "rgba(0,0,0,.22)";
      ctx.beginPath();
      ctx.ellipse(x + player.width / 2, y + player.height - 7, player.width * .38, 8, 0, 0, Math.PI * 2);
      ctx.fill();

      if (mascotSprite || (mascotSheet.complete && mascotSheet.naturalWidth)) {
        const drawW = 124;
        const drawH = 82;
        ctx.drawImage(mascotSprite || mascotSheet, x + player.width / 2 - drawW / 2, y + player.height / 2 - drawH / 2 - 4, drawW, drawH);
      } else {
        ctx.fillStyle = "#f9f4e8";
        ctx.beginPath();
        ctx.roundRect(x + 8, y + 18, player.width - 16, player.height - 24, 18);
        ctx.fill();
        ctx.strokeStyle = "#2f7d4a";
        ctx.lineWidth = 4;
        ctx.stroke();
        ctx.fillStyle = "#2f7d4a";
        ctx.font = "900 14px 'Malgun Gothic', sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("상상이", x + player.width / 2, y + player.height / 2);
      }

      ctx.restore();
    }

    function drawParticles() {
      particles.forEach(p => {
        ctx.globalAlpha = Math.max(0, p.life * 2);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;
    }

    function draw() {
      drawBackground();
      stars.forEach(drawStar);
      drawPlayer();
      drawParticles();
    }

    function gameLoop(now) {
      if (!running) return;
      const dt = Math.min((now - lastTime) / 1000, 0.033);
      lastTime = now;

      update(dt);
      draw();
      requestAnimationFrame(gameLoop);
    }

    window.addEventListener("keydown", e => {
      keys[e.key] = true;
      if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.key)) {
        e.preventDefault();
      }
    });

    window.addEventListener("keyup", e => {
      keys[e.key] = false;
    });

    document.querySelectorAll(".btn").forEach(btn => {
      const key = btn.dataset.key;

      const press = e => {
        e.preventDefault();
        keys[key] = true;
        btn.classList.add("active");
      };

      const release = e => {
        e.preventDefault();
        keys[key] = false;
        btn.classList.remove("active");
      };

      btn.addEventListener("pointerdown", press);
      btn.addEventListener("pointerup", release);
      btn.addEventListener("pointercancel", release);
      btn.addEventListener("pointerleave", release);
    });

    startBtn.addEventListener("click", startGame);
    restartBtn.addEventListener("click", startGame);

    draw();
  </script>
</body>
</html>
